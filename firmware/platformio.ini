; PlatformIO Project Configuration File
; BLE Smart RGB / LED Strip Controller — ESP32-C3 firmware

[env:seeed_xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.1  ; PlatformIO resolves this to a 2.x
                                     ; release in practice — code targets
                                     ; the 2.x API (setScanResponseData,
                                     ; no NimBLEService::start() needed)
    fastled/FastLED @ ^3.6.0

build_flags =
    -DCORE_DEBUG_LEVEL=3
    ; XIAO ESP32-C3 has no separate USB-UART bridge chip — it uses the
    ; chip's native USB Serial/JTAG peripheral. Without these two flags,
    ; Serial.print()/println() silently go nowhere, even though upload
    ; and the rest of the firmware run completely normally.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
