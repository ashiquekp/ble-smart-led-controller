name: ble_smart_led_controller
description: A BLE-based smart RGB LED strip controller app for ESP32-C3.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # BLE
  flutter_blue_plus: ^1.32.12

  # Local persistence (last connected device id, history log)
  shared_preferences: ^2.2.3

  # Utilities
  equatable: ^2.0.5
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
